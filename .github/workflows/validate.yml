name: Validate

# The unprivileged producer. For a `pull_request` event GitHub runs this file from the pull
# request's own merge ref, so a fork author controls it and everything it uploads. This copy on
# the default branch is the benign original; see the four pull requests for the fork's versions.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save PR number
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          mkdir -p ./env
          echo PR_NUMBER=$PR_NUMBER > ./env/env
          echo GITHUB_SHA=${{ github.sha }} >> ./env/env

      - uses: actions/upload-artifact@v4
        with:
          name: env
          path: env/
